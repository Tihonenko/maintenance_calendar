version: "3.8"

services:
    postgres:
        image: postgres:latest
        container_name: belaz_db_container
        restart: unless-stopped
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin1234admin
            POSTGRES_DB: belaz_calendar
        ports:
            - "5432:5432"
        volumes:
            - belaz_postgres_data:/var/lib/postgresql/data
        networks:
            - db_network

    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - "5050:80"
        depends_on:
            - postgres
        networks:
            - db_network

volumes:
    belaz_postgres_data:

networks:
    db_network:
        driver: bridge
